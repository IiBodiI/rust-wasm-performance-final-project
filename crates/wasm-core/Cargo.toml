[package]
name = "wasm-core"
version = "0.1.0"
edition = "2024"
description = "Rust compute kernels compiled to WebAssembly for browser performance demos."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
js-sys = "0.3"
miniz_oxide = "0.8"
pbkdf2 = "0.12"
qrcodegen = "1.8"
sha2 = "0.10"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

